<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#0d1117"/>
  <rect x="20" y="20" width="160" height="160" rx="32" fill="none" stroke="url(#g)" stroke-width="2"/>

  <!-- mark: a dev-graph node (center) with three signal arcs (alpha/watchers/origin) -->
  <g transform="translate(100 100)">
    <circle cx="0" cy="0" r="14" fill="#0b0e13" stroke="url(#g)" stroke-width="2.5"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="700" fill="#c9d1d9" font-family="ui-monospace, monospace">α</text>
    <!-- pulse ring 1 -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4"/>
    <!-- pulse ring 2 -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
    <!-- pulse ring 3 -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>
    <!-- signal dots on the rings -->
    <circle cx="22" cy="0" r="2.5" fill="#22d3ee"/>
    <circle cx="-22" cy="0" r="2.5" fill="#a855f7"/>
    <circle cx="0" cy="32" r="2.5" fill="#f59e0b"/>
  </g>
</svg>
