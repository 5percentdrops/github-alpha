<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="GitHub Alpha hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="alphaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- top brand bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#bar)"/>

  <!-- traffic lights + caption -->
  <g transform="translate(28,24)">
    <circle cx="0"  cy="0" r="5" fill="#ef4444"/>
    <circle cx="16" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="32" cy="0" r="5" fill="#22c55e"/>
  </g>
  <text x="600" y="28" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="12" fill="#94a3b8" letter-spacing="0.5">
    github-alpha  ·  src/scanner/run-scan.js  ·  :3847/api/signals
  </text>

  <!-- left: title -->
  <g transform="translate(60,76)">
    <text font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="42" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">
      GitHub Alpha
    </text>
    <text y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="16" fill="#94a3b8" letter-spacing="0.2">
      Burst-commit intelligence on 7,719 high-follower developers.
    </text>
    <text y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="13" fill="#7c5cff" letter-spacing="0.3">
      ALPHA ≥ 75 commits / 48h  ·  WATCHING 1–74  ·  DORMANT 0
    </text>
  </g>

  <!-- right: live signal card -->
  <g transform="translate(720,56)">
    <rect width="440" height="180" rx="10" fill="url(#alphaFill)"
          stroke="#30363d" stroke-width="1"/>

    <!-- card header -->
    <text x="20" y="26" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12" fill="#94a3b8">GET /api/signals  ·  top alpha</text>

    <!-- row 1: ALPHA -->
    <g transform="translate(20,46)">
      <rect width="400" height="36" rx="6" fill="#161b22" stroke="#7c5cff" stroke-width="1"/>
      <path d="M14 8 L0 24 L10 24 L6 32 L20 16 L10 16 Z"
            fill="url(#bolt)" transform="translate(10,4)"/>
      <text x="46" y="16" font-family="ui-sans-serif, system-ui, sans-serif"
            font-size="12" font-weight="700" fill="#e6edf3">bchachra / obsidian-graph-os</text>
      <text x="46" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#94a3b8">182 commits / 48h  ·  watch 41 / star 9</text>
      <text x="380" y="22" text-anchor="end"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#22d3ee">ALPHA</text>
    </g>

    <!-- row 2: ALPHA -->
    <g transform="translate(20,90)">
      <rect width="400" height="36" rx="6" fill="#161b22" stroke="#7c5cff" stroke-width="1"/>
      <path d="M14 8 L0 24 L10 24 L6 32 L20 16 L10 16 Z"
            fill="url(#bolt)" transform="translate(10,4)"/>
      <text x="46" y="16" font-family="ui-sans-serif, system-ui, sans-serif"
            font-size="12" font-weight="700" fill="#e6edf3">kaila / ast-fuzz-rs</text>
      <text x="46" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#94a3b8">104 commits / 48h  ·  watch 22 / star 6</text>
      <text x="380" y="22" text-anchor="end"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#22d3ee">ALPHA</text>
    </g>

    <!-- row 3: WATCHING -->
    <g transform="translate(20,134)">
      <rect width="400" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="14" cy="18" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="14" cy="18" r="1.5" fill="#f59e0b"/>
      <text x="30" y="16" font-family="ui-sans-serif, system-ui, sans-serif"
            font-size="12" font-weight="700" fill="#e6edf3">mlev / py-side-eye</text>
      <text x="30" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#94a3b8">22 commits / 48h  ·  watch 7 / star 12</text>
      <text x="380" y="22" text-anchor="end"
            font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
            font-size="11" fill="#f59e0b">WATCHING</text>
    </g>
  </g>

  <!-- legend band -->
  <g transform="translate(60,224)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
     font-size="11" fill="#94a3b8">
    <g>
      <path d="M0 4 L-6 12 L-2 12 L-4 18 L2 8 L-2 8 Z" fill="url(#bolt)"/>
      <text x="10" y="14">ALPHA  ≥75 commits / 48h</text>
    </g>
    <g transform="translate(220,0)">
      <circle cx="0" cy="10" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="1.5" fill="#f59e0b"/>
      <text x="10" y="14">WATCHING  1–74</text>
    </g>
    <g transform="translate(400,0)">
      <rect x="-3" y="6" width="6" height="8" fill="#475569"/>
      <text x="10" y="14">DORMANT  0</text>
    </g>
    <g transform="translate(560,0)">
      <text x="0" y="14" fill="#64748b">5 hard gates · watchers &gt; stars · repo age &lt; 30d</text>
    </g>
  </g>
</svg>